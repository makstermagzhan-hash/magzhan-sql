<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Жүйеге кіру | TICKET STAR</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="logo">TICKET STAR</div>
    <nav>
        <a href="index.html">Басты бет</a>
        <a href="register.html">Тіркелу</a>
    </nav>
</header>

<div class="container">
    <form id="loginForm">
        <h2>Жүйеге кіру</h2>

        <input
            type="email"
            id="loginEmail"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Құпиясөз"
            required
        >

        <button type="submit" class="btn">Кіру</button>

        <p>Аккаунтыңыз жоқ па?
            <a href="register.html">Тіркелу</a>
        </p>
    </form>
</div>

<script src="js/script.js"></script>
</body>
</html>
