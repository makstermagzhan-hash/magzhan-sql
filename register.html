<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тіркелу | TICKET STAR</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="logo">TICKET STAR</div>
    <nav>
        <a href="index.html">Басты бет</a>
        <a href="login.html">Кіру</a>
    </nav>
</header>

<div class="container">
    <form id="registerForm">
        <h2>Тіркелу</h2>

        <input
            type="text"
            id="fullName"
            placeholder="Аты-жөніңіз"
            required
        >

        <input
            type="email"
            id="registerEmail"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="registerPassword"
            placeholder="Құпиясөз"
            minlength="6"
            required
        >

        <button type="submit" class="btn">Тіркелу</button>
    </form>
</div>

<script src="js/script.js"></script>
</body>
</html>
